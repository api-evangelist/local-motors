aid: local-motors
name: Local Motors
description: >-
  Local Motors was an American vehicle manufacturer founded in 2007 by John "Jay" Rogers Jr.
  that built vehicles through open co-creation and distributed "microfactories" rather than
  conventional mass production. Its community designed and the company produced the Rally
  Fighter off-road car from its first Chandler, Arizona microfactory, the Strati — the first
  car to be 3D-printed live, in 44 hours at IMTS 2014 — and, from 2016, Olli, a 3D-printed
  electric autonomous shuttle whose conversational passenger interface ran on IBM Watson and
  which was piloted at National Harbor, Maryland and other campus and transit sites. The
  company operated microfactories in Chandler, Knoxville and National Harbor and spun its
  crowdsourcing community out as Launch Forth. Local Motors ceased operations in January 2022
  after fifteen years, having failed to raise further capital, and its intellectual-property
  portfolio was acquired by drone manufacturer RapidFlight of Manassas, Virginia in July 2023.
  Local Motors never operated a public developer program: the archive of localmotors.com holds
  an internal django-tastypie JSON API under /api/v1/ that served the co-creation community
  website, but no developer portal, API reference, SDK, or machine-readable specification was
  ever published, and its GitHub organization has zero public repositories. The domain is no
  longer the company's — it now answers HTTP 301 on every path to a third-party affiliate
  article — so there is no live API surface to catalog. This profile is retained as a
  historical record.
