historical:
  method: searched
  source: http://web.archive.org/cdx/search/cdx?url=localmotors.com/api*
  finding: >-
    The Internet Archive CDX index shows that localmotors.com once served an internal
    django-tastypie style JSON API under /api/v1/ — resources including /api/v1/content/,
    /api/v1/blog_post/, /api/v1/category_counts/, /api/v1/cart_item/ and
    /api/v1/user/login/, with tastypie query conventions (order_by, limit, offset). This
    was the AJAX backend of the Local Motors co-creation community website, not a published
    developer product: the archive holds NO /developer*, NO /docs*, and no crawl of any
    openapi/swagger path on the domain in its entire history. Snapshots taken from 2022-09
    onward record 301 on these paths, matching the current blanket redirect.
  developer_portal_ever_published: false
  crawls:
