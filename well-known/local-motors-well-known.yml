name: Local Motors well-known + contract discovery probe
description: >-
  Negative probe record for Local Motors. Local Motors Inc. (Phoenix, Arizona) ceased
  operations in January 2022 after 15 years, and its intellectual-property portfolio —
  including the 3D-printed autonomous Olli shuttle — was acquired by RapidFlight
  (Manassas, Virginia) in July 2023. The localmotors.com domain is no longer operated by
  the company: it now answers HTTP 301 on EVERY path, including every /.well-known/* and
  every spec path, redirecting to a third-party affiliate content article at
  housegrail.com -> homegrail.com. NONE of these responses is a document served by Local
  Motors. No WellKnown, SecurityTxt, AgentCard, LLMsTxt, OpenAPI or MCPServer pointer is
  emitted from this probe, and none should ever be emitted from it in a later round.

