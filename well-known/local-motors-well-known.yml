- what: Forge Global secondary-market listing (the harvest source)
  url: https://forgeglobal.com/local-motors_stock/
  status: 403
  result: blocked
  note: >-
    Forge answers 403 with a Cloudflare "Just a moment..." challenge to non-browser clients.
    The page exists; it is a secondary-market share listing venue, not a Local Motors site.
    Recorded here because roadmap#56 tracks venue-listing-as-Website across the harvest
    backlog and this repo is one of that cohort.

conclusion: >-
  Local Motors has no API surface to enrich and no host it still controls. The company is
  defunct, its domain has been repurposed by an unrelated affiliate content operator, every
  developer-shaped subdomain is NXDOMAIN, its GitHub organization is empty, and no registry
  carries a first-party package. This is a historical record, not a thin profile. Any future
  round should re-read host_status before probing localmotors.com again — a 200 from that
  host belongs to homegrail.com, not to Local Motors.
